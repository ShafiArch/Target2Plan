[package]
name = "target2plan"
version = "1.0.0"
description = "Target2Plan: from a room program and QVCI / AQI targets to schematic floor plans"
authors = ["Shafiul Islam"]
license = "CC-BY-NC-4.0"
repository = "https://github.com/ShafiArch/Target2Plan"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
strip = true
